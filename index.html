<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f4f6">
  <meta name="description" content="経済プリント1〜15ページを、SVGでなめらかに再描画した赤シート。ページを縦に読み進め、空欄をタップして答えを確認できます。">
  <title>経済プリント｜赤シート</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="sr-only">経済プリント 赤シート</h1>
  <nav class="page-nav" aria-label="ページ選択">
    <div id="page-tabs" class="page-tabs"></div>
    <button id="toggle-all" class="toggle-all" type="button" aria-pressed="false">すべて表示</button>
  </nav>
  <main>
    <div id="load-error" role="alert" hidden></div>
    <div id="pages-list" class="pages-list" aria-label="経済プリント"></div>
    <footer><span>経済プリント 1〜15ページ</span><span>文字・図をSVGで再描画</span></footer>
  </main>
  <dialog id="editor">
    <form method="dialog" class="dialog-head"><div><p>解答の確認・修正</p><h2 id="editor-title"></h2></div><button aria-label="閉じる">×</button></form>
    <p class="dialog-help">入力した修正はこの端末に保存されます。写真の未記入・判読不明も表示しています。</p>
    <div id="answer-list"></div>
    <div class="dialog-foot"><button id="reset-edits" type="button">このページの修正を戻す</button><button id="close-editor" type="button">閉じる</button></div>
  </dialog>
  <div id="glyph-store" aria-hidden="true"></div>
  <script src="app.js" defer></script>
</body>
</html>
